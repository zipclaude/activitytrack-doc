# Shared-runner minutes are paid for: no pipeline starts on its own. Start one by
# hand ("Run pipeline") or through the pipelines API, e.g. for the secret scan.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages:
- test
- secret-detection
secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml
