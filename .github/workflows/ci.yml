# CI of activitytrack-doc on GitHub: the backup of the GitLab project. It mirrors .gitlab-ci.yml
# (the reference: keep the two in step, see CLAUDE.md "GitHub backup"), so that the backup can
# build, package and release the documentation on its own if GitLab is unavailable.
#
# Nothing runs on its own, as on GitLab: no pull_request, no push on other branches, no push
# on tags. Start a run by hand ("Run workflow" on a branch or on a tag, or `gh workflow run`),
# or push a branch named ghtest/<anything>: it lets a workflow be tried before it is on the
# default branch (a dispatch needs the file there).
# Started on a branch a run builds the PDFs and the package and publishes nothing;
# started on a tag vX.Y.Z it also checks that the documents carry that version and publishes
# the release: the PDFs and the package activitytrack-doc.
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["ghtest/**"]

permissions:
  contents: read

# a newer run of a branch replaces the older one (GitLab: interruptible); a release is never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # the PDFs of the three projects, it and en; on a tag the version lines are checked first
  manual:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      # git first: the checkout then is a clone, and the diagrams check below needs one
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git pandoc graphviz chromium fonts-dejavu fonts-liberation python3 python3-pymupdf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version lines (tags only)
        if: ${{ github.ref_type == 'tag' }}
        run: scripts/check-manual.sh "$GITHUB_REF_NAME"

      - name: Build the PDFs
        run: |
          # the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          V=$(cat VERSION)
          scripts/build-manual.sh "$V"

      # the diagrams are generated: the committed ones must be what the build makes of them
      - name: Check the diagrams
        run: git diff --exit-code -- manual/app/*/diagrams || { echo "regenerate the diagrams (scripts/build-manual.sh) and commit them"; exit 1; }

      # screenshots at most a quarter of a page
      - name: Check the PDFs
        run: python3 -I scripts/check-pdf.py build/manual/*.pdf

      - name: Collect the PDFs
        run: mkdir dist && cp build/manual/*.pdf dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: dist/*.pdf
          retention-days: 30

  # the package is tried on a tag and in every run started by hand (GitLab: web/api pipelines)
  deb:
    needs: manual
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper devscripts lintian

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdf
          path: dist

      - name: Build and check the package
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # version: a beta 0.9.10-beta-1 is 0.9.10~beta-1 (sorts before 0.9.10), the revision follows
          V=$(cat VERSION)
          if [ "$REF_TYPE" = tag ]; then test "v$V" = "$TAG"; fi
          DV=$(echo "$V" | sed 's/-/~/')
          PV=$(dpkg-parsechangelog -S Version)
          test "$(dpkg-parsechangelog -S Source)" = activitytrack-doc && test "${PV%-*}" = "$DV" && test "$PV" != "$DV"
          mkdir -p build/manual && cp dist/*.pdf build/manual/
          dpkg-buildpackage -b -us -uc
          mkdir -p out && mv ../activitytrack-doc_*.deb out/
          dpkg-deb --info out/*.deb
          dpkg-deb --contents out/*.deb
          lintian --fail-on error --no-tag-display-limit out/*.deb
          apt-get install -y ./out/*.deb
          ls /usr/share/doc/activitytrack-doc/it /usr/share/doc/activitytrack-doc/en
          apt-get purge -y activitytrack-doc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: out/*.deb
          retention-days: 30

  # the PDFs and the package go to the GitHub Release of the tag (GitLab: its Generic Packages,
  # linked from the release); a version with a suffix is a beta: a pre-release
  release:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: [manual, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the only job that writes: it creates the release
    steps:
      # GitLab matches the tag /^v[0-9]/ (a plain v* in `if`: the regex is not available there)
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9] ]] || { echo "::error::$TAG is not a version tag (vX.Y.Z)"; exit 1; }'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{pdf,deb}"
          path: artifacts
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          cd artifacts
          # "~" of the package versions is not allowed in an asset's name (GitHub turns it into "."): "-" instead, as on GitLab
          for f in activitytrack-doc_*~*_all.deb; do [ -e "$f" ] && mv "$f" "$(echo "$f" | tr '~' '-')"; done; true
          sha256sum * > SHA256SUMS && cat SHA256SUMS
          cd ..
          {
            echo "ActivityTrack documentation $V: manuals of the app, the server and the desktop application, Italian and English."
            echo
            echo "- PDFs: the files below. Package for Debian and Ubuntu: \`apt install ./activitytrack-doc_*_all.deb\` (files in /usr/share/doc/activitytrack-doc)."
            echo "- The other projects' releases link here for their manuals."
          } > notes.md
          case "$V" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # no checkout: the release is created from the tag on the server
          gh release create "$TAG" artifacts/* --verify-tag --title "ActivityTrack documentation $V" --notes-file notes.md $pre

  # ---- GitLab only ----
  # secret_detection: GitLab's Security/Secret-Detection template. On GitHub the repository's own
  #   secret scanning and push protection (repository settings) do that job.
